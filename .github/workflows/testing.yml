---
name: testing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2019
          - macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Install dependencies
        shell: bash
        run: |
          go install github.com/magefile/mage@v1.15.0
          go install github.com/elastic/go-licenser@v0.4.1
          go install golang.org/x/tools/cmd/goimports@v0.14.0
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run tests
        shell: bash
        run: |
          mkdir -p build
          mage -v test 2>&1 | tee build/test-report.out
          exit ${PIPESTATUS[0]}

      - name: Generate JUnit report
        if: always()
        shell: bash
        run: go-junit-report -in build/test-report.out -iocopy -out build/junit-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/*.xml
